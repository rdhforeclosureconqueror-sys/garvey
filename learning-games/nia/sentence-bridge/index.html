<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nia's Sentence Bridge</title>
<style>
:root{font-family:system-ui,sans-serif;color:#26334c;background:#e9f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(1.5rem,5vw,2.5rem);margin:.5rem 0}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 8px 30px #17345518}.scene{position:relative;height:180px;border-radius:18px;background:linear-gradient(#9de3ff 60%,#6abb83 60%);overflow:hidden;display:flex;align-items:end;justify-content:space-between;padding:20px;font-size:55px}.river{position:absolute;bottom:0;left:24%;width:52%;height:65px;background:#3ca9d4}.planks{position:absolute;bottom:55px;left:25%;width:50%;display:flex;gap:4px}.plank{flex:1;height:22px;background:#ffffff99;border:2px dashed #7b5e3d;border-radius:4px}.plank.ready{background:#b98a51;border-style:solid}.character,.castle{z-index:1}.words,.answer{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:68px;align-items:center;padding:12px}.answer{border:2px dashed #8db4c6;border-radius:16px;margin:16px 0}.word,button{font:inherit;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;touch-action:manipulation}.word{background:#f3e7bf;color:#282638;font-weight:700}.word:focus-visible,button:focus-visible{outline:3px solid #3459d2;outline-offset:3px}button.primary{background:#324fc1;color:white}button.secondary{background:#dce8fb;color:#243769}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{flex:1}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:48px;font-weight:650;text-align:center}.meta{font-size:.9rem}#celebration{font-size:1.3rem;color:#167449} @media(max-width:440px){main{padding:10px}.card{padding:12px}.scene{height:145px}}
</style></head><body><main><header><span>✨ Nia's Writing Adventure</span><span id="score" class="meta"></span></header><section class="card"><h1>🌉 Sentence Bridge</h1><p>Tap words to make a complete sentence. Each correct word builds the bridge!</p><div class="scene" aria-label="Bridge across a river"><span class="character">👸🏾</span><div class="river"></div><div class="planks" id="planks"></div><span class="castle">🏰</span></div><h2 id="instruction">Build the sentence</h2><div id="answer" class="answer" aria-label="Your sentence"></div><div id="words" class="words" aria-label="Available words"></div><p class="status" id="status" role="status" aria-live="polite"></p><div class="controls"><button class="secondary" id="hint">💡 Hint</button><button class="secondary" id="reset">↺ Reset</button><button class="primary" id="check">Check answer</button><button class="primary" id="next" hidden>Next bridge →</button></div></section><p class="meta">Progress is saved on this device. Practice is not a school grade.</p></main>
<script>
const challenges=[
{words:['dog','The','runs.'],answer:['The','dog','runs.'],hint:'Start with who is doing something.'},
{words:['outside.','plays','Nia'],answer:['Nia','plays','outside.'],hint:'Who is playing?'},
{words:['ball.','a','kicks','girl','The'],answer:['The','girl','kicks','a','ball.'],hint:'Start with The girl, then say what she does.'},
{words:['is','happy.','The','cat'],answer:['The','cat','is','happy.'],hint:'Who is happy?'},
{words:['read','We','books.'],answer:['We','read','books.'],hint:'Begin with We.'},
{words:['bird','The','sings.'],answer:['The','bird','sings.'],hint:'What does the bird do?'}
];
const key='nia-sentence-bridge-v1';let progress={index:0,completed:0,attempts:0,hints:0};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Number.isInteger(saved.index)){progress={...progress,...saved};progress.index=Math.max(0,Math.min(challenges.length-1,progress.index))}}catch(e){}
let selected=[],solved=false;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(key,JSON.stringify(progress))}catch(e){}};const current=()=>challenges[progress.index];
function render(){const c=current();$('score').textContent=progress.completed+'/'+challenges.length+' bridges';$('answer').replaceChildren();$('words').replaceChildren();$('planks').replaceChildren();c.answer.forEach((_,i)=>{const plank=document.createElement('div');plank.className='plank'+(i<selected.length?' ready':'');$('planks').append(plank)});selected.forEach((item,i)=>{const b=document.createElement('button');b.className='word';b.textContent=item.word;b.setAttribute('aria-label','Remove '+item.word);b.onclick=()=>{if(solved)return;selected.splice(i,1);render()};$('answer').append(b)});c.words.forEach((word,i)=>{if(selected.some(item=>item.id===i))return;const b=document.createElement('button');b.className='word';b.textContent=word;b.onclick=()=>{if(solved)return;selected.push({word,id:i});$('status').textContent='';render()};$('words').append(b)});$('check').disabled=solved||selected.length!==c.words.length;$('next').hidden=!solved;$('instruction').textContent='Bridge '+(progress.index+1)+' · Build the sentence'}
$('hint').onclick=()=>{progress.hints++;save();$('status').textContent='Hint: '+current().hint};$('reset').onclick=()=>{selected=[];solved=false;$('status').textContent='Try again!';render()};
$('check').onclick=()=>{progress.attempts++;const correct=selected.map(x=>x.word).join(' ')===current().answer.join(' ');if(correct){solved=true;progress.completed=Math.max(progress.completed,progress.index+1);$('status').textContent='🌟 Wonderful! You repaired the bridge!';$('status').id='status';$('next').textContent=progress.index===challenges.length-1?'Play again ↻':'Next bridge →'}else{$('status').textContent='Good try! Read the sentence aloud, then rearrange the words.'}save();render()};
$('next').onclick=()=>{progress.index=(progress.index+1)%challenges.length;selected=[];solved=false;save();$('status').textContent='';render()};render();
</script></body></html>
