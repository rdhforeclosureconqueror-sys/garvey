name: Ten Gates Adinkra pilot checks
on:
  pull_request:
    paths:
      - 'gates-v2/content/adinkra/**'
      - 'public/gamehub/content/adinkra-lesson-adapter.js'
      - 'public/gamehub/content/gate-attention.pilot.json'
      - 'public/gamehub/content/game.js'
      - 'public/gamehub/content/mate-masie-challenge.js'
      - 'tests/gates/mate-masie-challenge.test.js'
      - 'tests/gates/adinkra-browser-wiring.test.js'
      - 'tests/gates/adinkra-browser-smoke.cjs'
      - 'public/gamehub/content/index.html'
      - 'public/gates.html'
      - 'public/gates.js'
      - 'public/gates.css'
      - 'public/gates-landing.js'
      - 'public/ten-gates-journey.html'
      - 'tests/gates/adinkra-homepage.test.js'
      - 'tests/gates/adinkra-lesson-adapter.test.js'
      - '.github/workflows/ten-gates-adinkra.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curriculum and adapter
        run: node --test tests/gates/adinkra-lesson-adapter.test.js tests/gates/mate-masie-challenge.test.js tests/gates/adinkra-browser-wiring.test.js tests/gates/adinkra-homepage.test.js
      - name: Check browser game syntax
        run: |
          node --check public/gamehub/content/game.js
          node --check public/gamehub/content/adinkra-lesson-adapter.js
          node --check public/gamehub/content/mate-masie-challenge.js
          node --check public/gates-landing.js
          node --check public/gates.js
      - name: Check browser copy matches source
        run: cmp gates-v2/content/adinkra/gate-attention.pilot.json public/gamehub/content/gate-attention.pilot.json
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8765 --directory public > /tmp/gates-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/gamehub/content/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gates-server.log
          exit 1
      - name: Exercise Keeper in Chromium
        run: node tests/gates/adinkra-browser-smoke.cjs
